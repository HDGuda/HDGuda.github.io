<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2433c9">
<title>Song abspielen</title>
<style>
  :root {
    --grund: #2433c9;
    --knopf: #ffd84a;
    --tinte: #101540;
    --ring: #ffffff;
    --ring-leer: rgba(255, 255, 255, 0.28);
    color-scheme: only light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--grund);
    color: #fff;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .scheibe {
    position: relative;
    width: clamp(240px, 72vmin, 420px);
    aspect-ratio: 1;
  }
  .scheibe svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
  }
  .scheibe circle { fill: none; stroke-width: 3; }
  .spur { stroke: var(--ring-leer); }
  #fortschritt {
    stroke: var(--ring);
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    opacity: 0;
  }
  #knopf {
    position: absolute;
    inset: 7%;
    border: 0;
    border-radius: 50%;
    background: var(--knopf);
    color: var(--tinte);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1.75rem, 8.4vmin, 3.1rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    white-space: pre-line;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0.8vmin 0 rgba(16, 21, 64, 0.35);
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  #knopf:active { transform: translateY(0.5vmin) scale(0.98); box-shadow: 0 0.3vmin 0 rgba(16, 21, 64, 0.35); }
  #knopf:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  #knopf:disabled { opacity: 0.45; cursor: not-allowed; }
  #hinweis {
    margin: 0;
    min-height: 3.2em;
    max-width: 28ch;
    padding: 0 1rem;
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.4;
  }
  .regler {
    width: clamp(240px, 72vmin, 420px);
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .regler label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-weight: 700;
    font-size: 1rem;
  }
  .regler output {
    font-weight: 800;
    color: var(--knopf);
    font-variant-numeric: tabular-nums;
  }
  .regler input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2.25rem;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  .regler input[type=range]:disabled { opacity: 0.45; cursor: not-allowed; }
  .regler input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--ring-leer); }
  .regler input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--ring-leer); }
  .regler input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    margin-top: -11px;
    border: 0;
    border-radius: 50%;
    background: var(--knopf);
    box-shadow: 0 2px 0 rgba(16, 21, 64, 0.35);
  }
  .regler input[type=range]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: var(--knopf);
    box-shadow: 0 2px 0 rgba(16, 21, 64, 0.35);
  }
  .regler input[type=range]:focus-visible { outline: 3px solid #fff; outline-offset: 2px; border-radius: 6px; }
  .skala {
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 0.8rem;
    opacity: 0.75;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) {
    #knopf { transition: none; }
  }
</style>
</head>
<body>
  <div class="scheibe">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="spur" cx="50" cy="50" r="47"></circle>
      <circle id="fortschritt" cx="50" cy="50" r="47" pathLength="100"></circle>
    </svg>
    <button id="knopf" type="button">Song
abspielen</button>
  </div>
  <div class="regler">
    <label for="dauer"><span>Abspielzeit</span><output id="dauerAnzeige" for="dauer">2 Sekunden</output></label>
    <input id="dauer" type="range" min="1" max="5" step="1" value="2" aria-valuetext="2 Sekunden">
    <div class="skala" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
  <p id="hinweis" role="status" aria-live="polite"></p>

<script>
(function () {
  'use strict';

  var VERZOEGERUNG_MS = 2000;   // Wartezeit nach dem Antippen
  var START_FRIST_MS  = 4000;   // so lange darf der Start nach der Wartezeit dauern
  var SPIELDAUER_STANDARD_S = 2; // Startwert des Reglers (Regler: 1 bis 5 Sekunden)
  // true:  Klappt das Abspielen in der Seite nicht, wird der Amazon-Link direkt geöffnet
  //        (dort läuft dann die ganze Vorschau, die Dauer lässt sich nicht begrenzen).
  // false: In diesem Fall erscheint stattdessen eine Fehlermeldung.
  var AUSWEICHEN_ERLAUBT = true;
  var BASIS = 'https://music.amazon.de/getSampleTrack/';

  var knopf    = document.getElementById('knopf');
  var ring     = document.getElementById('fortschritt');
  var hinweis  = document.getElementById('hinweis');
  var reduziert = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Abspielzeit: Regler 1 bis 5 Sekunden, die Wahl bleibt im Browser gespeichert.
  var regler  = document.getElementById('dauer');
  var anzeige = document.getElementById('dauerAnzeige');
  var SPEICHER_KEY = 'hitsterSpielzeit';
  var spielDauerMs = SPIELDAUER_STANDARD_S * 1000;
  try {
    var gespeichert = parseInt(localStorage.getItem(SPEICHER_KEY), 10);
    if (gespeichert >= 1 && gespeichert <= 5) spielDauerMs = gespeichert * 1000;
  } catch (e) { /* kein Speicher verfügbar: Startwert bleibt */ }

  function dauerAnzeigen() {
    var s = Math.round(spielDauerMs / 1000);
    var text = s + (s === 1 ? ' Sekunde' : ' Sekunden');
    regler.value = String(s);
    anzeige.textContent = text;
    regler.setAttribute('aria-valuetext', text);
  }

  // Die Karte liefert die ASIN: index.html?a=B0XXXXXXXX
  var asin = (new URLSearchParams(location.search).get('a') || '').trim().toUpperCase();
  var gueltig = /^[A-Z0-9]{10}$/.test(asin);
  var url = BASIS + asin;

  var audio = null;
  var zustand = 'bereit';        // bereit | wartet | spielt
  var ausweichend = false;
  var timerFreigabe = null, timerFrist = null, timerAusweichen = null, timerTakt = null;
  var startZeit = 0;

  function beschriften() {
    knopf.textContent = zustand === 'bereit' ? 'Song\nabspielen' : 'Stopp';
    regler.disabled = zustand !== 'bereit';
  }

  function ringSetzen(offset, dauerMs) {
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = '100';
    void ring.getBoundingClientRect();
    if (dauerMs && !reduziert) {
      ring.style.transition = 'stroke-dashoffset ' + dauerMs + 'ms linear';
    }
    ring.style.strokeDashoffset = String(offset);
  }

  function zuruecksetzen() {
    clearTimeout(timerFreigabe);
    clearTimeout(timerFrist);
    clearTimeout(timerAusweichen);
    clearInterval(timerTakt);
    if (audio) {
      var a = audio;
      audio = null;
      a.pause();
      a.removeAttribute('src');
      a.load();
    }
    zustand = 'bereit';
    ausweichend = false;
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = '100';
    ring.style.opacity = '0';
    beschriften();
  }

  // Reservewege: Wenn der Browser die Vorschau nicht in der Seite abspielt,
  // wird nach der Wartezeit der Amazon-Link direkt geöffnet.
  function ausweichen() {
    if (ausweichend) return;
    if (!AUSWEICHEN_ERLAUBT) {
      zuruecksetzen();
      hinweis.textContent = 'Der Song konnte nicht abgespielt werden. Tippe noch einmal.';
      return;
    }
    ausweichend = true;
    clearTimeout(timerFrist);
    if (audio) audio.pause();
    var rest = Math.max(0, VERZOEGERUNG_MS - (performance.now() - startZeit));
    timerAusweichen = setTimeout(function () { location.href = url; }, rest);
  }

  function freigeben() {
    if (!audio || ausweichend) return;
    var a = audio;
    zustand = 'spielt';
    try { a.currentTime = 0; } catch (e) { /* Stream nicht suchbar: egal */ }
    a.muted = false;
    ringSetzen(0, 0);
    if (!reduziert) ring.style.transition = 'stroke-dashoffset 80ms linear';

    // Gezählt wird die tatsächliche Abspielzeit des Elements (nicht die Uhrzeit):
    // Hängt der Stream kurz, läuft die Zeit nicht weiter und der Song wird nicht verkürzt.
    var ab = a.currentTime;
    var dauer = spielDauerMs;
    timerTakt = setInterval(function () {
      if (a !== audio || zustand !== 'spielt') return;
      var gespielt = (a.currentTime - ab) * 1000;
      if (gespielt >= dauer) { zuruecksetzen(); return; }
      ring.style.strokeDashoffset = String(Math.max(0, 100 * gespielt / dauer));
    }, 30);

    if (a.paused) {
      var p = a.play();
      if (p && p.catch) p.catch(function () { if (a === audio) ausweichen(); });
    }
    timerFrist = setTimeout(function () {
      if (a === audio && (a.paused || a.currentTime < 0.2)) ausweichen();
    }, START_FRIST_MS);
  }

  function starten() {
    hinweis.textContent = '';
    zustand = 'wartet';
    ausweichend = false;
    beschriften();

    // Das Audio-Element wird direkt beim Tippen gestartet (stumm), damit
    // iOS und Android die spätere Wiedergabe ohne weiteres Tippen erlauben.
    var a = new Audio();
    audio = a;
    a.preload = 'auto';
    a.muted = true;
    a.src = url;
    a.addEventListener('error', function () { if (a === audio) ausweichen(); });
    a.addEventListener('ended', function () { if (a === audio) zuruecksetzen(); });
    var p = a.play();
    if (p && p.catch) p.catch(function () { if (a === audio) ausweichen(); });

    startZeit = performance.now();
    ring.style.opacity = '1';
    ringSetzen(0, VERZOEGERUNG_MS);
    timerFreigabe = setTimeout(freigeben, VERZOEGERUNG_MS);
  }

  if (!gueltig) {
    knopf.disabled = true;
    hinweis.textContent = 'Dieser QR-Code ist ungültig. Scanne die Karte noch einmal.';
  } else {
    knopf.addEventListener('click', function () {
      if (zustand === 'bereit') starten(); else zuruecksetzen();
    });
  }

  // Zurück-Taste aus dem Amazon-Player: Seite im Ausgangszustand zeigen.
  window.addEventListener('pageshow', function (e) { if (e.persisted) zuruecksetzen(); });
  window.addEventListener('pagehide', function () { if (audio) audio.pause(); });

  regler.addEventListener('input', function () {
    spielDauerMs = parseInt(regler.value, 10) * 1000;
    dauerAnzeigen();
    try { localStorage.setItem(SPEICHER_KEY, String(spielDauerMs / 1000)); } catch (e) { /* egal */ }
  });

  dauerAnzeigen();
  beschriften();
})();
</script>
</body>
</html>

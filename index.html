<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2433c9">
<title>Song abspielen</title>
<style>
  :root {
    --grund: #2433c9;
    --knopf: #ffd84a;
    --tinte: #101540;
    --ring: #ffffff;
    --ring-leer: rgba(255, 255, 255, 0.28);
    color-scheme: only light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--grund);
    color: #fff;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .scheibe {
    position: relative;
    width: clamp(240px, 72vmin, 420px);
    aspect-ratio: 1;
  }
  .scheibe svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
  }
  .scheibe circle { fill: none; stroke-width: 3; }
  .spur { stroke: var(--ring-leer); }
  #fortschritt {
    stroke: var(--ring);
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
  }
  #knopf {
    position: absolute;
    inset: 7%;
    border: 0;
    border-radius: 50%;
    background: var(--knopf);
    color: var(--tinte);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1.75rem, 8.4vmin, 3.1rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    white-space: pre-line;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0.8vmin 0 rgba(16, 21, 64, 0.35);
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  #knopf:active { transform: translateY(0.5vmin) scale(0.98); box-shadow: 0 0.3vmin 0 rgba(16, 21, 64, 0.35); }
  #knopf:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  #knopf:disabled { opacity: 0.45; cursor: not-allowed; }
  #hinweis {
    margin: 0;
    min-height: 3.2em;
    max-width: 28ch;
    padding: 0 1rem;
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.4;
  }
  @media (prefers-reduced-motion: reduce) {
    #knopf { transition: none; }
  }
</style>
</head>
<body>
  <div class="scheibe">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="spur" cx="50" cy="50" r="47"></circle>
      <circle id="fortschritt" cx="50" cy="50" r="47" pathLength="100"></circle>
    </svg>
    <button id="knopf" type="button">Song
abspielen</button>
  </div>
  <p id="hinweis" role="status" aria-live="polite"></p>

<script>
(function () {
  'use strict';

  var VERZOEGERUNG_MS = 2000;   // Wartezeit nach dem Antippen
  var START_FRIST_MS  = 4000;   // so lange darf der Start nach der Wartezeit dauern
  var BASIS = 'https://music.amazon.de/getSampleTrack/';

  var knopf    = document.getElementById('knopf');
  var ring     = document.getElementById('fortschritt');
  var hinweis  = document.getElementById('hinweis');
  var reduziert = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Die Karte liefert die ASIN: index.html?a=B0XXXXXXXX
  var asin = (new URLSearchParams(location.search).get('a') || '').trim().toUpperCase();
  var gueltig = /^[A-Z0-9]{10}$/.test(asin);
  var url = BASIS + asin;

  var audio = null;
  var zustand = 'bereit';        // bereit | wartet | spielt
  var ausweichend = false;
  var timerFreigabe = null, timerFrist = null, timerAusweichen = null;
  var startZeit = 0;

  function beschriften() {
    knopf.textContent = zustand === 'bereit' ? 'Song\nabspielen' : 'Stopp';
  }

  function ringSetzen(offset, dauerMs) {
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = '100';
    void ring.getBoundingClientRect();
    if (dauerMs && !reduziert) {
      ring.style.transition = 'stroke-dashoffset ' + dauerMs + 'ms linear';
    }
    ring.style.strokeDashoffset = String(offset);
  }

  function zuruecksetzen() {
    clearTimeout(timerFreigabe);
    clearTimeout(timerFrist);
    clearTimeout(timerAusweichen);
    if (audio) {
      var a = audio;
      audio = null;
      a.pause();
      a.removeAttribute('src');
      a.load();
    }
    zustand = 'bereit';
    ausweichend = false;
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = '100';
    beschriften();
  }

  // Reservewege: Wenn der Browser die Vorschau nicht in der Seite abspielt,
  // wird nach der Wartezeit der Amazon-Link direkt geöffnet.
  function ausweichen() {
    if (ausweichend) return;
    ausweichend = true;
    clearTimeout(timerFrist);
    if (audio) audio.pause();
    var rest = Math.max(0, VERZOEGERUNG_MS - (performance.now() - startZeit));
    timerAusweichen = setTimeout(function () { location.href = url; }, rest);
  }

  function freigeben() {
    if (!audio || ausweichend) return;
    var a = audio;
    zustand = 'spielt';
    try { a.currentTime = 0; } catch (e) { /* Stream nicht suchbar: egal */ }
    a.muted = false;
    ringSetzen(0, 0);
    if (a.paused) {
      var p = a.play();
      if (p && p.catch) p.catch(function () { if (a === audio) ausweichen(); });
    }
    timerFrist = setTimeout(function () {
      if (a === audio && (a.paused || a.currentTime < 0.2)) ausweichen();
    }, START_FRIST_MS);
  }

  function starten() {
    hinweis.textContent = '';
    zustand = 'wartet';
    ausweichend = false;
    beschriften();

    // Das Audio-Element wird direkt beim Tippen gestartet (stumm), damit
    // iOS und Android die spätere Wiedergabe ohne weiteres Tippen erlauben.
    var a = new Audio();
    audio = a;
    a.preload = 'auto';
    a.muted = true;
    a.src = url;
    a.addEventListener('error', function () { if (a === audio) ausweichen(); });
    a.addEventListener('ended', function () { if (a === audio) zuruecksetzen(); });
    a.addEventListener('timeupdate', function () {
      if (a !== audio || zustand !== 'spielt') return;
      if (isFinite(a.duration) && a.duration > 0) {
        ring.style.strokeDashoffset = String(Math.min(100, 100 * a.currentTime / a.duration));
      }
    });
    var p = a.play();
    if (p && p.catch) p.catch(function () { if (a === audio) ausweichen(); });

    startZeit = performance.now();
    ringSetzen(0, VERZOEGERUNG_MS);
    timerFreigabe = setTimeout(freigeben, VERZOEGERUNG_MS);
  }

  if (!gueltig) {
    knopf.disabled = true;
    hinweis.textContent = 'Dieser QR-Code ist ungültig. Scanne die Karte noch einmal.';
  } else {
    knopf.addEventListener('click', function () {
      if (zustand === 'bereit') starten(); else zuruecksetzen();
    });
  }

  // Zurück-Taste aus dem Amazon-Player: Seite im Ausgangszustand zeigen.
  window.addEventListener('pageshow', function (e) { if (e.persisted) zuruecksetzen(); });
  window.addEventListener('pagehide', function () { if (audio) audio.pause(); });

  beschriften();
})();
</script>
</body>
</html>
